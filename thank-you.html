<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're In — AI Video Blueprint</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #080808;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .check {
            font-size: 48px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(40px, 8vw, 64px);
            margin: 0 0 16px;
            letter-spacing: -2px;
        }

        p {
            color: #a0a0a0;
            font-size: 18px;
            line-height: 1.6;
            margin: 0 auto 32px;
        }

        .download {
            display: inline-block;
            padding: 16px 28px;
            background: #ffffff;
            color: #000000;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            border-radius: 8px;
            transition: transform 0.2s ease;
        }

        .download:hover {
            transform: translateY(-2px);
        }

        .note {
            margin-top: 24px;
            font-size: 14px;
            color: #666666;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="check">✓</div>

        <h1>YOU'RE IN.</h1>

        <p>
            Your AI Video Blueprint is ready.
            Download it below and start making your first video.
        </p>

        <a class="download" href="/AI-Video-Blueprint.pdf" download>
            DOWNLOAD THE BLUEPRINT
        </a>

        <div class="note">
            Keep the PDF somewhere safe so you can access it whenever you need it.
        </div>

    </div>

</body>
</html>
